name: Tests and Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read  # the build itself only reads; only the release job below may write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # the tag check below needs main's history

      - name: Check the tag (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Select-String -Path skyfold\config.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { Write-Error "Tag ${{ github.ref_name }} doesn't match VERSION $version"; exit 1 }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "The tagged commit is not on main"; exit 1 }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv "$env:LOCALAPPDATA\Skyfold-build\venv"
          & "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe" -m pip install -r requirements.lock.txt

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: '& "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe" -m pytest tests -q'

      - name: Build portable app
        shell: pwsh
        run: ./build.ps1

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          Start-Process dist\Skyfold\Skyfold.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern "RESULT: ALL OK" -Quiet)) { exit 1 }

      - name: Zip
        shell: pwsh
        run: |
          # Only the program itself goes in (an allowlist), never settings or sign-in data left by the self-test.
          $stage = "zip-stage\Skyfold"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist\Skyfold\Skyfold.exe $stage
          Copy-Item dist\Skyfold\_internal $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath Skyfold-windows.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\Skyfold-windows.zip")
          $bad = $zip.Entries | Where-Object { $_.FullName -match '(^|[\\/])(data|session)[\\/]|settings\.json$|\.sqlite3$|\.log$|cookiejar|\.session$' }
          $zip.Dispose()
          if ($bad) { $bad | ForEach-Object { $_.FullName }; Write-Error "Runtime data found in the zip"; exit 1 }
          (Get-FileHash Skyfold-windows.zip -Algorithm SHA256).Hash.ToLower() + "  Skyfold-windows.zip" | Out-File -Encoding ascii Skyfold-windows.zip.sha256
          Get-Content Skyfold-windows.zip.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Skyfold-windows
          path: |
            Skyfold-windows.zip
            Skyfold-windows.zip.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the zip to the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: Skyfold-windows

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            Skyfold-windows.zip
            Skyfold-windows.zip.sha256
