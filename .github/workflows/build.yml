name: Tests and Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read  # the build itself only reads; only the release job below may write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv "$env:LOCALAPPDATA\Skyfold-build\venv"
          & "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe" -m pip install -r requirements.lock.txt

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: '& "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe" -m pytest tests -q'

      - name: Build portable app
        shell: pwsh
        run: ./build.ps1

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          Start-Process dist\Skyfold\Skyfold.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern "RESULT: ALL OK" -Quiet)) { exit 1 }

      - name: Zip
        shell: pwsh
        run: |
          Remove-Item dist\Skyfold\data -Recurse -Force -ErrorAction SilentlyContinue  # never ship settings
          Compress-Archive -Path dist\Skyfold -DestinationPath Skyfold-windows.zip
          (Get-FileHash Skyfold-windows.zip -Algorithm SHA256).Hash.ToLower() + "  Skyfold-windows.zip" | Out-File -Encoding ascii Skyfold-windows.zip.sha256
          Get-Content Skyfold-windows.zip.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Skyfold-windows
          path: |
            Skyfold-windows.zip
            Skyfold-windows.zip.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the zip to the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: Skyfold-windows

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            Skyfold-windows.zip
            Skyfold-windows.zip.sha256
