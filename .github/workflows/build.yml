name: Tests and Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:  # a test build of a branch, the same way releases are built

permissions:
  contents: read  # the build itself only reads; only the release job below may write

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write  # releases only: sign the build attestation (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # the tag check below needs main's history

      - name: Check the tag (releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}  # passed as data, never pasted into the script
        run: |
          $version = (Select-String -Path skyfold\config.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) { Write-Error "Tag $env:TAG doesn't match VERSION $version"; exit 1 }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { Write-Error "The tagged commit is not on main"; exit 1 }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv "$env:LOCALAPPDATA\Skyfold-build\venv"
          & "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe" -m pip install -r requirements.lock.txt

      - name: Compile PyInstaller's starter program from source
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          # Skyfold.exe starts with PyInstaller's small starter program (the bootloader). The ready-made
          # one in PyInstaller's wheel is shared by countless programs, malware included, so antivirus
          # models often flag it. One compiled here from PyInstaller's source is Skyfold's own.
          $py = "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe"
          $hash = { & $py -c "import PyInstaller, pathlib, hashlib; p = pathlib.Path(PyInstaller.__file__).parent / 'bootloader' / 'Windows-64bit-intel' / 'runw.exe'; print(hashlib.sha256(p.read_bytes()).hexdigest())" }
          $before = & $hash
          $version = (Select-String -Path requirements.lock.txt -Pattern '^pyinstaller==(.+)$').Matches[0].Groups[1].Value
          & $py -m pip install --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$version"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $after = & $hash
          "starter from the wheel: $before"
          "starter compiled here:  $after"
          if (-not $after -or $after -eq $before) { Write-Error "The starter program was not compiled from source"; exit 1 }

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: '& "$env:LOCALAPPDATA\Skyfold-build\venv\Scripts\python.exe" -m pytest tests -q'

      - name: Build portable app
        shell: pwsh
        run: ./build.ps1

      - name: Self-test the packaged exe
        shell: pwsh
        run: |
          Start-Process dist\Skyfold\Skyfold.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait
          Get-Content selftest.txt
          if (-not (Select-String -Path selftest.txt -Pattern "RESULT: ALL OK" -Quiet)) { exit 1 }

      - name: Zip
        shell: pwsh
        run: |
          # Only the program itself goes in (an allowlist), never settings or sign-in data left by the self-test.
          $stage = "zip-stage\Skyfold"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item dist\Skyfold\Skyfold.exe $stage
          Copy-Item dist\Skyfold\_internal $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath Skyfold-windows.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD\Skyfold-windows.zip")
          $bad = $zip.Entries | Where-Object { $_.FullName -match '(^|[\\/])(data|session)[\\/]|settings\.json$|\.sqlite3(-wal|-shm)?$|\.log(\.\d+)?$|drive_cache\.json$|signed-out$|cookiejar|\.session$' }
          $zip.Dispose()
          if ($bad) { $bad | ForEach-Object { $_.FullName }; Write-Error "Runtime data found in the zip"; exit 1 }
          # LF line ending, so `sha256sum -c` works on Linux and macOS too
          [IO.File]::WriteAllText("$PWD\Skyfold-windows.zip.sha256", (Get-FileHash Skyfold-windows.zip -Algorithm SHA256).Hash.ToLower() + "  Skyfold-windows.zip`n")
          Get-Content Skyfold-windows.zip.sha256

      - name: Attest the release zip (in-app updates check it)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: Skyfold-windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: Skyfold-windows
          path: |
            Skyfold-windows.zip
            Skyfold-windows.zip.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the zip to the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: Skyfold-windows

      # Release immutability is on: the files must be attached while the release is still a draft,
      # because a published release no longer accepts them. So: draft, attach, then publish.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            Skyfold-windows.zip
            Skyfold-windows.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
