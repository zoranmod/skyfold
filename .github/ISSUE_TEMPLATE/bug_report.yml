name: Bug report
description: Something doesn't sync, crashes or looks wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **never post your Apple ID password, 2FA codes or the contents of the `session` folder.**
        For a security problem, use [private reporting](https://github.com/zoranmod/skyfold/security/advisories/new) instead of an issue.
  - type: input
    id: version
    attributes:
      label: Skyfold version
      description: Settings → About
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: checkboxes
    id: area
    attributes:
      label: Which part?
      options:
        - label: Sign-in / two-factor code
        - label: iCloud Photos
        - label: iCloud Drive
        - label: Apple Notes
        - label: Find My / iCloud storage
        - label: Tray panel / settings / other
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Turn on iCloud Drive with folder X selected
        2. Rename a folder on the PC
        3. ...
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: |
        Open `%LOCALAPPDATA%\Skyfold\skyfold.log` (paste `%LOCALAPPDATA%\Skyfold` into the Explorer address bar) and paste the lines around the problem.
        **Remove personal data first:** your Apple ID email, your Windows user name in paths (`C:\Users\<name>`), and any file, album or note names you don't want to share.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed my Apple ID, user name and private file names from the log and screenshots.
          required: true
